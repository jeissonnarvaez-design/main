<h1>Iniciar sesión</h1>

<form (ngSubmit)="entrar()">
  <div>
    <label for="email">Email:</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      placeholder="user@mail.com"
      required
    />
  </div>

  <div>
    <label for="password">Password:</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      placeholder="123"
      required
    />
  </div>

  <button type="submit">Entrar</button>
</form>

@if (error) {
  <p style="color: red;">{{ error }}</p>
}
