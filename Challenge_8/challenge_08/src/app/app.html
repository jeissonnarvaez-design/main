<nav class="menu">
  <a routerLink="/login" routerLinkActive="activo">Login</a>

  @if (auth.estaLogueado()) {
    <a routerLink="/private/pagina1" routerLinkActive="activo">Página 1</a>
    <a routerLink="/private/pagina2" routerLinkActive="activo">Página 2</a>
    <span class="usuario">Usuario: {{ auth.usuario() }}</span>
    <button (click)="auth.salir()">Cerrar sesión</button>
  }
</nav>

<main>
  <router-outlet />
</main>
