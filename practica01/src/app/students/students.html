<h3>Lista de Estudiantes (Nodos)</h3>

@if (students.length > 0) {
  <ul>
    @for (student of students; track student.code) {
      <li>
        <strong>{{ student.name }}</strong> - Edad: {{ student.age }} | Código: {{ student.code }}
        <button (click)="onDelete(student.code)">Eliminar</button>
      </li>
    }
  </ul>
} @else {
  <p>No hay estudiantes registrados en la lista enlazada.</p>
}
