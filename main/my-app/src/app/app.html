<main class="app-container">
  <h1>Agenda de Contactos</h1>

  @if (isLoading()) {
    <app-loader></app-loader>
  } @else {
    <app-formulario (onAdd)="addContact($event)"></app-formulario>

    <app-lista
      [contactos]="contactos()"
      (onDelete)="deleteContact($event)">
    </app-lista>
  }
</main>
