<div class="card">
  <h2>Historial del Navegador</h2>

  @if (currentPage) {
  <div class="browser-info">
    <div class="browser-bar">
      <span> {{ currentPage.value.url }}</span>
    </div>

    <h3>{{ currentPage.value.titulo }}</h3>

    <div class="controls">
      <button 
        (click)="goBack()" 
        [disabled]="!currentPage.prev">
        Atrás
      </button>

      <button 
        (click)="goForward()" 
        [disabled]="!currentPage.next">
        Adelante
      </button>
    </div>
  </div>
} @else {
  <p>No hay páginas en el historial.</p>
}
</div>
