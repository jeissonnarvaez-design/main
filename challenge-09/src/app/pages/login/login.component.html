<!-- src/app/pages/login/login.component.html -->
<div class="auth-container">
  <div class="card p-4 shadow">
    <h2 class="mb-4 text-center">Iniciar Sesión</h2>
    <div class="mb-3">
      <input type="email" placeholder="Correo electrónico" [ngModel]="email()" (ngModelChange)="email.set($event)" class="form-control" />
    </div>
    <div class="mb-3">
      <input type="password" placeholder="Contraseña" [ngModel]="password()" (ngModelChange)="password.set($event)" class="form-control" />
    </div>
    <button type="button" (click)="handleLogin()" class="btn btn-primary w-100">Ingresar</button>
    <p class="mt-3 text-center">¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
  </div>
</div>
