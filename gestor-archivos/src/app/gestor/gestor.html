<div class="gestor-container">
  <header>
    <h1>Gestor de Archivos ({{ authService.usuario()?.email }})</h1>
    <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
  </header>

  <div class="crear-form">
    <input 
      type="text" 
      [(ngModel)]="nuevoNombre" 
      name="nuevoNombre"
      placeholder="Nombre del nuevo elemento" 
    />
    
    <select [(ngModel)]="nuevoTipo" name="nuevoTipo">
      <option value="carpeta">Carpeta</option>
      <option value="archivo">Archivo</option>
    </select>

    <select [(ngModel)]="padreSeleccionadoId" name="padreSeleccionadoId">
      <option value="">-- Seleccionar Padre (Raíz) --</option>
      @for (c of obtenerCarpetas(); track c.id) {
        <option [value]="c.id">{{ c.nombre }}</option>
      }
    </select>
    
    <button 
      class="btn-crear" 
      (click)="crearElemento()" 
      [disabled]="!nuevoNombre">
      Crear
    </button>
  </div>

  <div class="arbol-visual">
    <h3>Estructura de Árbol:</h3>
    <ng-container 
      *ngTemplateOutlet="nodoTemplate; context: { $implicit: arbolService.raiz() }">
    </ng-container>
  </div>
</div>

<ng-template #nodoTemplate let-nodo>
  @if (nodo) {
    <div class="nodo" [class.carpeta]="nodo.tipo === 'carpeta'" [class.archivo]="nodo.tipo === 'archivo'">
      <span class="icono">{{ nodo.tipo === 'carpeta' ? '[DIR]' : '[FILE]' }}</span>
      <span class="nombre">{{ nodo.nombre }}</span>
      <span class="creador">({{ nodo.creadoPor }})</span>
      
      @if (nodo.hijos.length > 0) {
        <div class="hijos">
          @for (hijo of nodo.hijos; track hijo.id) {
            <ng-container 
              *ngTemplateOutlet="nodoTemplate; context: { $implicit: hijo }">
            </ng-container>
          }
        </div>
      }
    </div>
  }
</ng-template>
